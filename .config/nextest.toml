# A hung test must be a failure, not a wedged run. Retries are off on purpose: a retry that
# turns a real flake green would hide a determinism failure (D16).
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }
status-level = "pass"
final-status-level = "flaky"

# Dedicated test group for heavy threshold sweep and conformance runs to avoid CPU cache thrashing.
[test-groups]
heavy = { max-threads = 4 }

[[profile.default.overrides]]
# Threshold sweep and check tests evaluate multiple kernels across grids; allow 360s total before terminating.
filter = 'package(xtask) and (test(thresholds::tests::) or test(thresholds::measure::tests::) or test(conformance::selftest::tests::))'
slow-timeout = { period = "120s", terminate-after = 3 }
test-group = 'heavy'

[[profile.default.overrides]]
# The ignored measurements a decision record cites run for minutes on purpose; only
# `--run-ignored` reaches them.
filter = 'package(helicoid-linalg) and test(/::(measure|hill_climb)_/)'
slow-timeout = { period = "600s", terminate-after = 12 }

# Ultra-fast profile for interactive developer iteration
[profile.quick]
slow-timeout = { period = "30s", terminate-after = 2 }
status-level = "pass"
final-status-level = "flaky"
fail-fast = true
# `eig_sym`'s bounds at `N >= 24` cost 7-12 CPU-s each against a double-double reference, and a
# loaded host pushes them past the timeout above; `just test` runs them.
default-filter = 'not (package(helicoid-linalg) and test(/every_family_is_within_its_bounds_at_n_(24_40|64_f32|64_f64)$/))'

[[profile.quick.overrides]]
filter = 'package(xtask) and (test(thresholds::tests::) or test(thresholds::measure::tests::) or test(conformance::selftest::tests::))'
test-group = 'heavy'

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false
status-level = "slow"
final-status-level = "flaky"

[[profile.ci.overrides]]
# Match default override on CI runners.
filter = 'package(xtask) and (test(thresholds::tests::) or test(thresholds::measure::tests::) or test(conformance::selftest::tests::))'
slow-timeout = { period = "120s", terminate-after = 3 }
test-group = 'heavy'

