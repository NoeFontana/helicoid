# A hung test must be a failure, not a wedged run. Retries are off on purpose: a retry that
# turns a real flake green would hide a determinism failure (D16).
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }
final-status-level = "slow"

[[profile.default.overrides]]
# Threshold sweep and check tests evaluate multiple kernels across grids; allow 360s total before terminating.
filter = 'package(xtask) and test(thresholds::)'
slow-timeout = { period = "120s", terminate-after = 3 }

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false

[[profile.ci.overrides]]
# Match default override on CI runners.
filter = 'package(xtask) and test(thresholds::)'
slow-timeout = { period = "120s", terminate-after = 3 }

