[package]
name = "sophus_rs_runner"
description = "Oracle runner: the corpus through sophus-rs, file protocol of docs/PHASE1.md section 7."
version = "0.0.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The oracle: `sophus_lie` (SO(3) and SE(3), `exp`, `log`, the left Jacobian and its inverse) on
# `sophus_autodiff` (its vector types), both exact. `PIN` in `src/main.rs` names the first (a test
# compares it with this line and with `Cargo.lock`): the `subject_version` of every result row.
# 0.15.0 is the latest, the first with a Jacobian and the first with the tangent order of `0002`
# (0014 (draft) question 28).
sophus_lie = "=0.15.0"
sophus_autodiff = "=0.15.0"
serde_json = "1"

# Its own workspace and lockfile: nothing here enters the root `Cargo.lock` (`docs/PHASE1.md` §0).
[workspace]

# The root's lints, which a workspace-excluded crate does not inherit.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
float_cmp = "deny"
print_stdout = "warn"
print_stderr = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints]
workspace = true
