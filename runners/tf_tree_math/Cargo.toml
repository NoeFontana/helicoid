[package]
name = "tf_tree_math_runner"
description = "Oracle runner: the corpus through tf_tree_math, file protocol of docs/PHASE1.md section 7."
version = "0.0.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The oracle (`docs/decisions/0010`), pinned to one commit. `PIN` in `src/main.rs` names the same
# commit (a test compares it with this line and with `Cargo.lock`), and it is the `subject_version`
# of every result row. It is the commit tagged `v0.0.6`; its `src/` is that of `tf_tree_math` 0.0.6
# on crates.io.
tf_tree_math = { git = "https://github.com/NoeFontana/tf_tree", rev = "20bc5a0518ec791318777d2105ab3296047d84ec" }
serde_json = "1"

# Its own workspace and lockfile: nothing here enters the root `Cargo.lock` (`docs/PHASE1.md` §0).
[workspace]

# The root's lints, which a workspace-excluded crate does not inherit.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
float_cmp = "deny"
print_stdout = "warn"
print_stderr = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints]
workspace = true
