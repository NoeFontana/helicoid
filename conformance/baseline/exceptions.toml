# Domination exceptions (`docs/decisions/0046-explained-by-record-needs-a-record-to-point-at.md`).
#
# One row per `(fn, stratum, precision)` an oracle wins and a `ready` record explains. A row
# excepts the domination bar and nothing else: the maximum is still written to the baseline and
# still judged by no-regress, so an excepted stratum is watched more closely than a dominated one.
# `cargo xtask lint` fails a row whose record is missing or is a draft; `just envelope` fails a row
# whose stratum turns out to be dominated after all, and names it for deletion.
#
# Under `0088` the domination bar fails a resolved loss or a gross one (above 8 times the best
# oracle's maximum plus 1 u), so a stratum whose excess is neither needs no row. The `0046` tie
# (`so3_exp/theta:1e-5`) was deleted for that reason. `0076`'s two rows stay: `so3_act/q:nonunit`
# resolves, and `sen3_ad_n1/q:nonunit` (256 u against 2.1 u on 6 records) is gross.

[[exception]]
fn = "so3_act"
stratum = "q:nonunit"
precision = "f64"
record = "0076"
reason = "carried drift: helicoid returns 0058's Rv + eta(Rv - v), Sophus normalizes q at construction"

[[exception]]
fn = "sen3_ad_n1"
stratum = "q:nonunit"
precision = "f64"
record = "0076"
reason = "carried drift: helicoid's Ad blocks carry 0058's (1 + eta)R, Sophus normalizes q at construction"
