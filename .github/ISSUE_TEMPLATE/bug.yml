# Labels this form sets: bug, needs-triage. See config.yml.
name: Bug report
description: A wrong result, a panic, a non-finite output, a bit-identity break, a build failure.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        A **numerical** report is only actionable at an exact input. Give the binary64 inputs
        as `f64::to_bits` hex (or Python `float.hex()`), the function, the scalar (`f64`, `f32`,
        `Dual`) and the target. The corpus is exact-input by design
        ([`0006`](https://github.com/NoeFontana/helicoid/blob/main/docs/decisions/0006-the-instrument-comes-first.md)),
        so a failing input becomes a corpus stratum.

        A vulnerability is not a public issue: see
        [SECURITY.md](https://github.com/NoeFontana/helicoid/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, what you got, and the error or panic text.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest test or `main.rs` that shows it, from a clean checkout.
      render: rust
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      description: Mirrors the response table in SUPPORT.md.
      options:
        - Wrong result (error above the oracle envelope, wrong sign or ordering)
        - Non-finite output or panic on valid input
        - Outputs differ across x86_64, aarch64 or wasm32
        - Build, MSRV or no_std failure
        - Documentation is wrong or stale
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version, target and toolchain
      description: Commit or version, target triple, `rustc --version`.
    validations:
      required: true
  - type: input
    id: gate
    attributes:
      label: Which `just` recipe did you run, and what did it print?
      description: The gate is a local `just` recipe; a green pull-request check is not evidence by itself.
