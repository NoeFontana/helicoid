# Blank issues stay on: the most useful report is one that fits no form.
# GitHub silently drops labels that do not exist: `bug`, `needs-triage` and `question`
# (bug.yml, question.yml) must exist; create them with `gh label create`.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability — do not open an issue
    url: https://github.com/NoeFontana/helicoid/blob/main/SECURITY.md
    about: Mail the address in SECURITY.md instead; it also states what is in scope.
  - name: What is supported, and what response to expect
    url: https://github.com/NoeFontana/helicoid/blob/main/SUPPORT.md
    about: A single-maintainer, pre-1.0 project with honestly scoped timelines.
  - name: Propose a change the documents do not already cover
    url: https://github.com/NoeFontana/helicoid/blob/main/docs/decisions/README.md
    about: >-
      A new public item, crate, dependency, convention, chart or stratum family starts as a
      decision record, not as an issue or a pull request.
