# Every job wraps a `just` recipe. A green check covers only what the jobs cover.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - run: just lint
      - run: just audit

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # `rustfmt`: a test runs it over the emitter's layouts (`xtask/src/thresholds/emit.rs`).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - run: just build
      - run: just test

  # The floor is read from the manifest, so the job cannot drift from it.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: read rust-version from the workspace manifest
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          test -n "$v" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just msrv

  no-std:
    name: no-std (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just no-std

  wasm:
    name: wasm (wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just wasm

  # D16 (`docs/PHASE6.md` §3): one digest table per target, then one comparison. Wired, not yet
  # required: `PHASE1.md` §3 makes it required from Phase 6.
  determinism:
    name: determinism (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64, os: ubuntu-latest, recipe: determinism-digest }
          # `just test`'s `ndebug` profile, at opt-level 0: the optimizer moves no bit.
          - { target: x86_64-ndebug, os: ubuntu-latest, recipe: determinism-digest, args: ndebug }
          - { target: aarch64, os: ubuntu-24.04-arm, recipe: determinism-digest }
          - { target: wasm32, os: ubuntu-latest, recipe: determinism-wasm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasmtime
      - run: just ${{ matrix.recipe }} target/determinism/${{ matrix.target }}.txt ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: determinism-${{ matrix.target }}
          path: target/determinism/${{ matrix.target }}.txt

  determinism-compare:
    name: determinism (compare)
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: determinism-*
          path: target/determinism
          merge-multiple: true
      - run: >-
          cargo xtask determinism --compare target/determinism/x86_64.txt
          target/determinism/x86_64-ndebug.txt target/determinism/aarch64.txt
          target/determinism/wasm32.txt

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,mdbook,mdbook-katex
      - run: just doc
      - run: just book

  # Every planted defect must be detected by its named mechanism (`docs/PHASE1.md` §10).
  conformance:
    name: conformance (self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just conformance --self-test

  # A fresh sweep of each target must equal its committed files, which a hand edit fails: the seeded
  # kernels' (conformance/sweeps/thresholds-seeded.csv, xtask/src/seeded/generated.rs) and the arms
  # `helicoid` ships (conformance/sweeps/thresholds.csv, crates/helicoid/src/coeffs/generated.rs).
  thresholds:
    name: thresholds-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just thresholds-check

  # The bars of `docs/PHASE1.md` §8: the oracles' rows, then `just envelope --check` (domination,
  # exact no-regress, coverage, and a baseline and ENVELOPE.md that a bless would not change). The
  # candidate `helicoid` is not an in-process subject before Phase 3: until then the oracles' rows
  # are produced and not read, and only coverage is checked. Once `helicoid` is registered the job
  # fails when it writes no rows, so it becomes the required gate (§3) with the subject.
  # CI runners are too noisy for envelope checks as evidenced by recurring failures.
  envelope:
    name: envelope
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            runners/sophus_rs
            runners/nalgebra
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny
      - run: just oracle-sophus-rs
      - run: just oracle-nalgebra
      - run: just envelope --check

  # The committed corpus must regenerate byte-identically from the pinned generator.
  # About 17 CPU-minutes of generation plus the generator's tests; the timeout stops a runaway.
  corpus-check:
    name: corpus-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just corpus-check
