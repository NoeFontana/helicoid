# The nightly `oracles` job of `docs/PHASE1.md` §3: every oracle runner, the three containers built
# from their pins (§7). A pin that stops resolving (a snapshot, an archive, a digest) fails here
# rather than on the day someone needs the rows. The rows are kept as an artifact; no bar reads
# them here, as the `envelope` job in ci.yml is disabled.
name: oracles

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  oracles:
    name: oracles
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            runners/tf_tree_math
            runners/sophus_rs
            runners/nalgebra
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny
      - run: just oracles
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-rows
          path: conformance/results/
          if-no-files-found: ignore
