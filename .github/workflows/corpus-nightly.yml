# The corpus regenerates byte for byte with every task run and no cache, nightly (`0108`): the
# ground truth the per-PR skip and memo stand on, caught up with runner and interpreter updates
# even when nothing merges.
name: corpus nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-check-fresh:
    name: corpus-check (fresh)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just corpus-verify
      - id: key
        run: echo "key=$(just corpus-key)" >> "$GITHUB_OUTPUT"
      - run: just corpus-regen fresh
      - run: just corpus-test
      # On the default branch, where pull requests can read them: the proof and the memo of a run
      # of every task, under an interpreter a runner update may have moved.
      - run: echo "${{ steps.key.outputs.key }}" > .corpus-verified
      - uses: actions/cache/save@v6
        with:
          path: .corpus-verified
          key: corpus-verified-${{ steps.key.outputs.key }}
      - uses: actions/cache/save@v6
        with:
          path: conformance/generate/.memo
          key: corpus-memo-${{ runner.os }}-${{ github.run_id }}
