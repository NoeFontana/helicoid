version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      rust-deps:
        patterns: ["*"]
    open-pull-requests-limit: 10

  # A bump here changes the manifest, and possibly the corpus bytes: review it against
  # `just corpus-check`.
  - package-ecosystem: "uv"
    directory: "/conformance/generate"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # An oracle runner is a workspace-excluded crate with its own lockfile, reviewed like the root's.
  # Its git pin (`rev` in Cargo.toml, `PIN` in src/main.rs, Cargo.lock) moves by hand: a test
  # compares the three.
  - package-ecosystem: "cargo"
    directory: "/runners/tf_tree_math"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # The sophus-rs pin (`=0.15.0`, `PIN` in src/main.rs, Cargo.lock) moves by hand: 0.15.0 changed
  # the tangent order of 0.14.0 and earlier, so a bump is a decision (0014 (draft) question 28).
  - package-ecosystem: "cargo"
    directory: "/runners/sophus_rs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "sophus_lie"
      - dependency-name: "sophus_autodiff"

  # The nalgebra pin (`=0.35.0`, `PIN` in src/main.rs, Cargo.lock) moves by hand: a test compares
  # the three, and a new version's arithmetic moves the oracle's rows (`0056` decision 4).
  - package-ecosystem: "cargo"
    directory: "/runners/nalgebra"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "nalgebra"
