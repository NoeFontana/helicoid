version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      rust-deps:
        patterns: ["*"]
    open-pull-requests-limit: 10

  # A bump here changes the manifest, and possibly the corpus bytes: review it against
  # `just corpus-check`.
  - package-ecosystem: "uv"
    directory: "/conformance/generate"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Add `cargo` for `runners/*` when they land, reviewed the same way.
