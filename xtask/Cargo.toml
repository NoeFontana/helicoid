[package]
name = "xtask"
description = "Workspace automation for helicoid: corpus, conformance, thresholds, envelope, bench gate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Run from this checkout only (`cargo xtask <task>`); never a dependency of a library crate (`0007`).
publish = false

[lints]
workspace = true

[dependencies]
# xtask-only: the library crates' closure lint reads `cargo metadata` (`0007`). `derive` is
# on so the metadata structure is typed rather than probed as `serde_json::Value`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The conformance harness forms every error exactly (`docs/maths/error-analysis.md` EA.19): its
# integers reach ~2000 bits (a subnormal reference over a 30-digit decimal), past `u128`.
# Pure Rust, MIT OR Apache-2.0; `xtask` only, so never in a library closure (`0007`).
num-bigint = "0.5"
# The generated file names its sources by SHA-256 (`xtask/src/thresholds/emit.rs`). Pure Rust,
# MIT OR Apache-2.0; `xtask` only, so never in a library closure (`0007`).
sha2 = "0.11"
# The self-test's log-log fit goes through `libm`, as every library transcendental does (D16), so
# its printed exponent is the same bits on every host. Already in the lock file; MIT.
libm.workspace = true
# `Precision` is the harness's precision vocabulary (`docs/PHASE1.md` §5).
helicoid-linalg.workspace = true
# The threshold sweep measures `helicoid::coeffs` through its hidden `__sweep` feature, so the code
# measured is the code shipped (`0004` item 4). Only `xtask` may enable it (`cargo xtask lint`).
helicoid = { workspace = true, features = ["__sweep"] }
