[package]
name = "xtask"
description = "Workspace automation for helicoid: corpus, conformance, thresholds, envelope, bench gate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Run from this checkout only (`cargo xtask <task>`); never a dependency of a library crate (`0007`).
publish = false

[lints]
workspace = true

[dependencies]
# xtask-only: the library crates' closure lint reads `cargo metadata` (`0007`). `derive` is
# on so the metadata structure is typed rather than probed as `serde_json::Value`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
