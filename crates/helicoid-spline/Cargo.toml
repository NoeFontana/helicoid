[package]
name = "helicoid-spline"
description = "Uniform cumulative B-splines on Lie groups, with O(K) control Jacobians: no_std, no alloc, no unsafe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["lie-group", "b-spline", "robotics", "continuous-time", "no-std"]
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# `0114` decision 1: the groups reach D16's kernel, so no `libm` here.
[dependencies]
helicoid.workspace = true
helicoid-linalg.workspace = true

[lib]
bench = false

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

# `harness = false`: criterion supplies its own `main` (`0116` decision 6).
[[bench]]
name = "spline"
harness = false
