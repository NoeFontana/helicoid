[package]
name = "helicoid"
description = "Lie groups for robotics perception with structured Jacobians, charts and geodesics: no_std, no alloc, no unsafe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Hidden, not API: the coefficient evaluators `cargo xtask thresholds` sweeps, so the code measured is
# the code shipped (`docs/PHASE3.md` §3, `0004` item 4). Only `xtask` may enable it (`cargo xtask lint`).
__sweep = []

[dependencies]
helicoid-linalg.workspace = true
libm.workspace = true

# `cargo bench` would otherwise run the lib's own test harness, which does not understand
# criterion's arguments; the proptests are `just test`'s.
[lib]
bench = false

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

# `harness = false`: criterion supplies its own `main`. The bench reads the shipped kernel through
# the hidden `__sweep` feature, requested on the command line by `just bench` and never in a
# manifest, so `cargo xtask lint`'s check 5 still holds (only `xtask` may request it).
[[bench]]
name = "coeffs"
harness = false

# A second binary, not more rows in `coeffs`: `bench-gate --against` takes one bench binary, so the
# groups and the coefficient kernel are gated independently (`PHASE3.md` §11).
[[bench]]
name = "groups"
harness = false
