[package]
name = "helicoid"
description = "Lie groups for robotics perception with structured Jacobians, charts and geodesics: no_std, no alloc, no unsafe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Hidden, not API: the coefficient evaluators `cargo xtask thresholds` sweeps, so the code measured is
# the code shipped (`docs/PHASE3.md` §3, `0004` item 4). Only `xtask` may enable it (`cargo xtask lint`).
__sweep = []

[dependencies]
helicoid-linalg.workspace = true
libm.workspace = true

[dev-dependencies]
proptest.workspace = true
