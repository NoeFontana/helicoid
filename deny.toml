[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each ignore states what the advisory says, why it cannot be fixed, and what makes it removable.
ignore = []

[licenses]
version = 2
allow = ["MIT", "Apache-2.0"]  # extend when a dependency needs it, with the reason
confidence-threshold = 0.93

# `0007`'s bans (`nalgebra`, `faer`, `num-traits`, `bytemuck`, `serde`) bind the library crates
# only, and cargo-deny cannot scope a ban to a crate: `xtask` will need `serde`. The
# normal-dependency closure lint in `cargo xtask lint` will enforce them (owed, `docs/PHASE1.md` §3).
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
