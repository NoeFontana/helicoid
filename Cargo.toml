[workspace]
resolver = "2"
members = ["crates/helicoid-linalg", "crates/helicoid", "xtask"]
# The oracle runners' dependency graphs never enter `Cargo.lock` (`docs/PHASE1.md` §0).
exclude = ["runners/sophus_rs", "runners/nalgebra"]

[workspace.package]
# 0.0.x: every release may break every other (`SUPPORT.md`).
version = "0.0.7"
edition = "2021"
# Never above the lowest MSRV among consumers (D17, `0007`). The `msrv` job reads this field.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NoeFontana/helicoid"
homepage = "https://github.com/NoeFontana/helicoid"
authors = ["Noé Fontana <noe.fontana.pro@gmail.com>"]
keywords = ["lie-group", "robotics", "se3", "so3", "no-std"]
categories = ["science::robotics", "mathematics", "no-std::no-alloc"]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
float_cmp = "deny"
print_stdout = "warn"
print_stderr = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"
# `SO3`, `SE3` (`0008`).
upper_case_acronyms = "allow"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

# Profiles are read from the workspace root only, so none of this reaches a consumer's build. No
# setting here can change a computed bit: Rust has no fast-math, and the corpus and threshold tests
# compare bits at every opt-level below (D16).
[profile.dev]
# Backtraces keep file and line, which is all a failing test prints.
debug = "line-tables-only"

# Third-party code compiled once and run by every test: `libm` under each transcendental,
# `num-bigint` under the conformance metric, proptest's generators, the corpus hash and parse.
# Named, not `"*"`: that also optimizes `syn`, `criterion` and `clap`, which tripled the cold build.
[profile.dev.package.libm]
opt-level = 3
[profile.dev.package.num-bigint]
opt-level = 3
[profile.dev.package.num-integer]
opt-level = 3
[profile.dev.package.num-traits]
opt-level = 3
[profile.dev.package.proptest]
opt-level = 3
[profile.dev.package.rand]
opt-level = 3
[profile.dev.package.rand_core]
opt-level = 3
[profile.dev.package.rand_xorshift]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3

# The harness's corpus tests run 2.4x faster at opt-level 1 for no more compile time.
# `debug-assertions` and `overflow-checks` stay on.
[profile.dev.package.xtask]
opt-level = 1

# `just test`'s second pass: the dev profile with `debug_assert!` compiled out and wrapping
# arithmetic, as a consumer's release build has them. What it tests is that cfg, not the optimizer:
# `--release` compiled the `helicoid` tests alone for 100 s.
[profile.ndebug]
inherits = "dev"
debug-assertions = false
overflow-checks = false

[workspace.dependencies]
helicoid = { path = "crates/helicoid", version = "0.0.7" }
helicoid-linalg = { path = "crates/helicoid-linalg", version = "0.0.7" }
# `0007`: the whole third-party budget of the library crates. `arch` routes only the exactly rounded
# `sqrt`, `fma` and `rint` to the target's instruction: every non-NaN bit is unchanged (D16, `0018`).
libm = { version = "0.2", default-features = false, features = ["arch"] }
# Optional interop of `helicoid-linalg` (`0007`); `mint` has no default features, the flag says so.
# 0.5.7 is the floor: the first with `From<mint::VectorN<T>> for [T; N]`, which the conversions use.
mint = { version = "0.5.7", default-features = false }
# Dev only: the proptests of the library crates. Never in a library crate's normal closure.
proptest = { version = "1", default-features = false, features = ["std"] }
# Dev only: the bench harness of `PHASE1.md` §9, pinned exactly as it says. `default-features =
# false` drops the HTML report (plotters, a template engine): `cargo xtask bench-gate` reads the
# raw samples under `target/criterion`, not the report. Never in a library crate's normal closure.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
